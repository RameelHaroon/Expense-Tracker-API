spring.application.name=Expense-Tracker-API

spring.profiles.active=dev

# Datasource ? uses env var in prod, falls back to localhost for local dev
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mydatabase}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:myuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secret}

# Flyway
spring.flyway.enabled=true
spring.flyway.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mydatabase}
spring.flyway.user=${SPRING_DATASOURCE_USERNAME:myuser}
spring.flyway.password=${SPRING_DATASOURCE_PASSWORD:secret}

# Hibernate ? let Flyway own the schema
spring.jpa.hibernate.ddl-auto=validate

# HikariCP ? retry connecting for up to 60s (important for Docker startup)
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-timeout=30000

spring.h2.console.enabled=false

# SQL logging
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=trace
logging.level.org.springframework.security=DEBUG

# JWT ? injected via env var, fallback for local dev only
jwt.secret=${JWT_SECRET:Vkw/oiy0/QboWXJnXkeQs2KObrhE+84jrB8EDYuD4Qk=}
jwt.expiration=${JWT_EXPIRATION:86400000}